# তোমার বাংলাদেশ কোথায়? — local Apache vhost.
#
# DocumentRoot MUST point at public/ — serving the project root exposes .env,
# storage/ and vendor/.
#
# Install:
#   cp deploy/amarbangladesh.local.conf /etc/apache2/sites-available/
#   sudo a2ensite amarbangladesh.local && sudo systemctl reload apache2
#   echo "127.0.0.1 amarbangladesh.local www.amarbangladesh.local" | sudo tee -a /etc/hosts
#
# Apache runs as www-data, so storage/ and bootstrap/cache carry group www-data
# with setgid so files written later inherit the group:
#   chgrp -R www-data storage bootstrap/cache
#   chmod -R g+rwX storage bootstrap/cache
#   find storage bootstrap/cache -type d -exec chmod g+s {} \;
#   mkdir -p storage/framework/views-apache && chmod 2775 storage/framework/views-apache
#
# Set APP_URL=http://amarbangladesh.local in .env (share URLs and og:image use it).

<VirtualHost *:80>
    ServerName amarbangladesh.local
    ServerAlias www.amarbangladesh.local

    DocumentRoot /var/www/html/raju/amarbangladesh/public

    # Apache compiles Blade views into its own folder: it runs as www-data while
    # artisan/tests run as you, and Blade can't touch() a file the other user owns.
    SetEnv VIEW_COMPILED_PATH /var/www/html/raju/amarbangladesh/storage/framework/views-apache

    <Directory /var/www/html/raju/amarbangladesh/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Never serve the application internals, even if DocumentRoot is misconfigured.
    <DirectoryMatch "/var/www/html/raju/amarbangladesh/(app|bootstrap|config|database|deploy|resources|routes|storage|tests|vendor)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/amarbangladesh.local-error.log
    CustomLog ${APACHE_LOG_DIR}/amarbangladesh.local-access.log combined
</VirtualHost>
