# তোমার বাংলাদেশ কোথায়? — nginx + PHP-FPM, behind Cloudflare.
# Install: copy to /etc/nginx/sites-available/amarbangladesh, set server_name, root and the
# PHP-FPM socket, then `ln -s ../sites-available/amarbangladesh /etc/nginx/sites-enabled/`,
# `nginx -t && systemctl reload nginx`.
#
# TLS: with Cloudflare SSL mode "Full (strict)", install a Cloudflare Origin Certificate
# (SSL/TLS → Origin Server) at the paths below. Without Cloudflare, use certbot instead.
# The real visitor IP is resolved by Laravel (TRUSTED_PROXIES=cloudflare), not here.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # MUST be public/ — the project root holds .env, storage/ and vendor/.
    root /var/www/amarbangladesh/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output is content-hashed, so it can be cached for ever.
    location /build/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP files, and nothing hidden (.env, .git) is ever served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
